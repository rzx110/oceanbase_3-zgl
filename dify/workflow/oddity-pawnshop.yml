          write: 30
        title: 翻开 PowerContext 记忆账本
        type: http-request
        url: '{{#env.BACKEND_URL#}}/v1/state'
      height: 94
      id: read_memory
      position:
        x: 310
        y: 230
      positionAbsolute:
