    - data:
        code: "\"\"\"Pure rules, also embedded verbatim in the Dify Code node by build_dsl.py.\"\
          \"\"\nimport hashlib\nimport json\n\nITEMS = {\n    \"umbrella\": {\"title\"\
          : \"阴阳怪气的雨伞\", \"voice\": \"嘴硬心软，喜欢用天气比喻情绪\",\n                 \"secret\"\
          : \"我能替你挡住明天的尴尬，但挡不住你昨天没写完的作业。\"},\n    \"clock\": {\"title\": \"只响一次的闹钟\"\
          , \"voice\": \"像一个爱讲冷笑话的退休班主任\",\n              \"secret\": \"我只在截止日期前五分钟响一次；对拖延症，我一视同仁。\"\
          },\n    \"key\": {\"title\": \"开不了门的钥匙\", \"voice\": \"一本正经地胡说八道，自认为是哲学家\"\
          ,\n            \"secret\": \"我开不了门，但能打开一个你忘记很久的借口。\"},\n}\nACTIONS = {\"\
          greet\": \"打招呼\", \"prank\": \"恶作剧\", \"apologize\": \"道歉\", \"gift\": \"\
          送礼\", \"explore\": \"打听秘密\", \"recall\": \"翻旧账\"}\n\n\ndef initial_state():\n\
          \    return {\"turn\": 0, \"trust\": 0, \"grudge\": 0, \"pranks\": 0, \"\
          gifts\": 0, \"history\": []}\n\n\ndef plan_turn(player_code, item, action,\
          \ utterance, state):\n    if item not in ITEMS or action not in ACTIONS:\n\
          \        raise ValueError(\"未知物品或行动\")\n    utterance = utterance or \"\"\
          \n    if not isinstance(utterance, str) or len(utterance) > 140:\n     \
          \   raise ValueError(\"留言最多 140 字\")\n    character = ITEMS[item]\n    previous\
          \ = [x[\"summary\"] for x in state[\"history\"]]\n    remembered = previous[-1]\
          \ if previous else \"这是初次见面，没有旧账。\"\n    new = json.loads(json.dumps(state,\
          \ ensure_ascii=False))\n    unlocked = False\n    if action != \"recall\"\
          :\n        new[\"turn\"] += 1\n        if action == \"greet\":\n       \
          \     new[\"trust\"] = min(10, new[\"trust\"] + 1)\n            reaction\
          \ = \"它假装没看你，却把最亮的一面朝向你。\"\n        elif action == \"prank\":\n        \
          \    new[\"trust\"] = max(-5, new[\"trust\"] - 2)\n            new[\"grudge\"\
          ] += 1\n            new[\"pranks\"] += 1\n            reaction = \"它翻出一本《人类离谱行为登记簿》，郑重写下了这一笔。\"\
          \n        elif action == \"apologize\":\n            new[\"trust\"] = min(10,\
          \ new[\"trust\"] + 2)\n            new[\"grudge\"] = max(0, new[\"grudge\"\
          ] - 1)\n            reaction = \"它把这一页轻轻折起：原谅可以，失忆不行。\"\n        elif action\
          \ == \"gift\":\n            new[\"trust\"] = min(10, new[\"trust\"] + 2)\n\
          \            new[\"gifts\"] += 1\n            reaction = \"它收下礼物，还装作这只是一次严肃的学术交流。\"\
          \n        else:\n            unlocked = state[\"trust\"] >= 3 and state[\"\
          grudge\"] == 0\n            reaction = character[\"secret\"] if unlocked\
          \ else \"它把秘密藏得更深：先攒够 3 点信任，而且别欠着旧账。\"\n        summary = f\"第{new['turn']}轮，你对{character['title']}{ACTIONS[action]}\"\
          \n        if utterance:\n            summary += f\"，留下的话是「{utterance}」\"\
          \n        new[\"history\"] = (new[\"history\"] + [{\"turn\": new[\"turn\"\
          ], \"action\": action, \"summary\": summary}])[-8:]\n    else:\n       \
          \ reaction = \"它摊开旧账本，连你说话的标点都想圈起来。\" if previous else \"账本空空如也；它决定先给你一次做人的机会。\"\
          \n    fallback = f\"{character['title']}：{reaction}\\n\\n它记得：{remembered}\"\
          \n    if action == \"prank\" and new[\"pranks\"] >= 3:\n        fallback\
          \ += \"\\n你获得称号：当铺首席整活官。\"\n    identity = json.dumps({\"player\": player_code,\
          \ \"item\": item, \"action\": action, \"utterance\": utterance,\n      \
          \                     \"expected_turn\": state[\"turn\"]}, ensure_ascii=False,\
          \ sort_keys=True, separators=(\",\", \":\"))\n    return {\"player_code\"\
          : player_code, \"item\": item, \"action\": action, \"utterance\": utterance,\n\
          \            \"expected_turn\": state[\"turn\"], \"operation_id\": hashlib.sha256(identity.encode()).hexdigest(),\n\
          \            \"state\": new, \"fallback\": fallback, \"unlocked\": unlocked,\n\
          \            \"write\": action != \"recall\", \"character\": character,\
          \ \"remembered\": remembered}\n\n\ndef format_reply(state, narrative, memory_source):\n\
          \    history = \"\\n\".join(\"- \" + x[\"summary\"] for x in state[\"history\"\
          ]) or \"- 账本还空着，欢迎先打个招呼。\"\n    proof = memory_source[\"source_id\"] if\
          \ memory_source else \"尚未产生记忆记录\"\n    return (f\"## 奇物当铺 · 第 {state['turn']}\
          \ 轮\\n\\n{narrative}\\n\\n\"\n            f\"**信任 {state['trust']}** · **旧账\
          \ {state['grudge']}** · 恶作剧累计 {state['pranks']} 次\\n\\n\"\n            f\"\
          ### 真实记忆账本\\n{history}\\n\\n\"\n            \"**怎么玩**：打招呼 +1 信任；送礼/道歉 +2；恶作剧扣\
          \ 2。信任至少 3 且没有旧账时，可以打听秘密。\\n\\n\"\n            \"保留玩家代号，下次换一场 Dify 运行，奇物仍认得你。更换代号可从空白账本开始。\\\
          n\\n\"\n            f\"> PowerContext 记忆：`{proof}`\")\n\n\ndef main(player_code,\
          \ item, action, utterance, body, status_code):\n    if status_code != 200:\n\
          \        raise ValueError(\"记忆读取失败，请检查后端地址和令牌\")\n    context = json.loads(body)\n\
          \    plan = plan_turn(player_code, item, action, utterance or \"\", context[\"\
          state\"])\n    character = dict(plan[\"character\"])\n    if not plan[\"\
          unlocked\"]:\n        character.pop(\"secret\", None)\n    prompt = json.dumps({\"\
          奇物\": character, \"本轮行动\": ACTIONS[action],\n        \"本轮留言\": utterance\
          \ or \"\", \"之前的真实互动\": context[\"state\"][\"history\"],\n        \"上一轮故事\"\
          : context.get(\"last_story\", \"\"), \"规则决定的本轮结果\": plan[\"fallback\"],\n\
          \        \"本轮状态\": plan[\"state\"], \"是否解锁秘密\": plan[\"unlocked\"]}, ensure_ascii=False)\n\
          \    return {\"plan_json\": json.dumps(plan, ensure_ascii=False), \"prompt\"\
          : prompt,\n        \"recall_reply\": format_reply(context[\"state\"], plan[\"\
          fallback\"], context[\"memory_source\"]),\n        \"memory_source\": json.dumps(context[\"\
          memory_source\"], ensure_ascii=False)}\n"
        code_language: python3
        desc: ''
        outputs:
          memory_source:
            children: null
            type: string
          plan_json:
            children: null
            type: string
          prompt:
            children: null
            type: string
          recall_reply:
            children: null
            type: string
        selected: false
        title: 按真实旧账决定反应与分数
        type: code
