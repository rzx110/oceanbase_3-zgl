[project]
name = "sdd-context-desk"
version = "0.1.0"
description = "规有所依：MiniMax + seekdb + PowerContext 的可追溯开发上下文"
requires-python = ">=3.12"
dependencies = [
  "powercontext[builtin] @ git+https://github.com/oceanbase/powercontext.git@9db1753434162c0aa7c9f1189a1722e617880a52",
  "aiosqlite>=0.22,<1",
  "pymysql==1.2.3",
  "certifi==2026.10.23",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sdd_context"]

[project.scripts]
sdd-context = "sdd_context.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
